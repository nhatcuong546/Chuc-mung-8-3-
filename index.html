<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Chúc Mừng Dễ Thương</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #ffe4e1;
            margin: 0;
            min-height: 100vh;
        }
        h2 {
            color: #ff1493;
        }
        input, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            margin-top: 10px;
            width: 70%;
            max-width: 400px;
            box-sizing: border-box;
        }
        button {
            background-color: #ff69b4;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #ff1493;
        }
        #letter {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            background-color: white;
            display: none;
            box-shadow: 0px 0px 15px #ff1493;
            position: relative;
            opacity: 0;
            transform: translateY(100px);
            transition: opacity 2s ease-out, transform 2s ease-out;
        }
        .error {
            color: #ff6347;
            font-size: 18px;
        }
        .success {
            color: #32cd32;
            font-size: 18px;
        }
    </style>
</head>
<body>

        function showLetter() {
            let name = document.getElementById("nameInput").value.trim();
            let letterDiv = document.getElementById("letter");
            let errorMessageDiv = document.getElementById("errorMessage");

            // Clear previous error message if exists
            errorMessageDiv.style.display = "none";

            if (letters[name]) {
                letterDiv.innerHTML = `<h3>💌 Thư gửi ${name} 💌</h3><p>${letters[name]}</p>`;
                letterDiv.style.display = "block";
                setTimeout(() => {
                    letterDiv.style.opacity = "1";
                    letterDiv.style.transform = "translateY(0)";
                }, 200);
            } else {
                errorMessageDiv.innerHTML = "😢 Xin lỗi, chưa có thư cho tên này! Hãy thử lại nhé!";
                errorMessageDiv.style.display = "block";
                letterDiv.style.display = "none";  // Hide the letter div
            }
        }
